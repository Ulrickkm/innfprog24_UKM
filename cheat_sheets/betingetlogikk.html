<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheat sheet for Betinget logikk</title>
</head>
<body>

    <p id="loginStatus">Ikke logget inn</p>

    <script>
        const username = "ulrick"
        const password = "passord123"
        let loggedIn = false

        //IF-test som sjekker om innsendt brukernavn matcher systemet:
        if(username === "ulrick") {
            console.log("Brukernavn er riktig")
        } else {
            console.log("Feil brukernavn")
        }

        //IF-test som sjekker om innsendt brukernavn og passord er riktig, og gjør klar login:

        if(username === "ulrick" && password === "passord123") {
            loggedIn = true
            console.log(loggedIn)
        }
    </script>
</body>
</html>
